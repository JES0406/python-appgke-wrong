name: Test Secrets

on:
  workflow_dispatch:  # Puedes dispararlo manualmente

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check if secrets exist
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "ERROR: GCP_SA_KEY está vacío"
            exit 1
          else
            echo "OK: GCP_SA_KEY existe y tiene contenido"
          fi
          
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "ERROR: GCP_PROJECT_ID está vacío"
            exit 1
          else
            echo "OK: GCP_PROJECT_ID existe y tiene contenido"
          fi